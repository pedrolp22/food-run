name: Build, test and package

on:
  push:
    branches: [master, main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux
          - os: windows-2022
            platform: windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Linux build and display dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxss-dev libgl1-mesa-dev libasound2-dev libpulse-dev libwayland-dev libxkbcommon-dev xvfb
      - name: Configure Linux release and graphics tests
        if: runner.os == 'Linux'
        run: cmake --preset release -DSUBWAY_ENABLE_GRAPHICS_TESTS=ON
      - name: Configure Windows release (MSVC, static runtime)
        if: runner.os == 'Windows'
        run: cmake -S . -B build/release -G "Visual Studio 17 2022" -A x64 -DSUBWAY_PORTABLE_RELEASE=ON -DSUBWAY_BUILD_TESTS=ON
      - name: Build
        run: cmake --build build/release --config Release --parallel 2
      - name: Linux CPU and graphics tests
        if: runner.os == 'Linux'
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          SDL_VIDEODRIVER: x11
        run: xvfb-run -a -s '-screen 0 1280x1024x24' ctest --test-dir build/release -C Release --output-on-failure
      - name: Windows CPU tests
        if: runner.os == 'Windows'
        run: ctest --test-dir build/release -C Release --output-on-failure
      - name: Package runtime ZIP
        run: cpack --config build/release/CPackConfig.cmake -C Release -B dist
      - name: Verify package contents
        run: python scripts/verify_package.py dist
      - name: Linux extracted package smoke test
        if: runner.os == 'Linux'
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          SDL_VIDEODRIVER: x11
        run: xvfb-run -a -s '-screen 0 1280x1024x24' python scripts/verify_package.py dist --smoke-test
      - name: Windows extracted executable check
        if: runner.os == 'Windows'
        run: python scripts/verify_package.py dist --version-check
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: foodrun-${{ matrix.platform }}-x86_64
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
          compression-level: 0

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: foodrun-*
          path: dist
          merge-multiple: true
      - name: Check version and create matching source archive
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python scripts/source_release.py "$RELEASE_TAG" dist
      - name: Create draft release with both platforms and corresponding source
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" dist/*.zip dist/*.sha256 --verify-tag --draft --title "Food Run $RELEASE_TAG" --notes-file docs/RELEASE_NOTES.md
